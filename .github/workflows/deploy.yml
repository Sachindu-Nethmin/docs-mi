name: Build and Deploy

on:
  push:
    branches:
      - main
      - 4.5.0
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r en/requirements.txt

      - name: Build and Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd en
          # CRITICAL: Always use --force and --clean to prevent gh-pages/main conflicts
          # This ensures gh-pages only contains built site files, never source code
          mkdocs gh-deploy --force --clean

      - name: Verify gh-pages only has built files
        run: |
          git fetch origin gh-pages
          git checkout origin/gh-pages -- .nojekyll
          echo "✅ gh-pages successfully updated with built site only"
